[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floatchat"
version = "1.3.0"
description = "Local ARGO data retrieval and analysis service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb==1.5.9",
  "fastapi==0.141.1",
  "gsw==3.6.23",
  "httpx==0.28.1",
  "numpy==2.3.5",
  "pandas==3.0.5",
  "psycopg2-binary==2.9.12",
  "pydantic==2.13.4",
  "requests==2.34.2",
  "scipy==1.16.3",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==0.24.0",
  "httpx==0.28.1",
  "anyio==4.9.0",
]
lint = [
  "ruff==0.16.1",
]
type = [
  "mypy==2.3.0",
  "types-requests>=2.31.0",
]
metrics = [
  "prometheus-client>=0.20.0",
]
server = [
  "uvicorn[standard]==0.52.0",
  "fastapi==0.141.1",
]
dev = [
  "floatchat[test,lint,type,metrics]",
  "pre-commit>=3.7.0",
  "pip-audit>=2.7.0",
]
all = [
  "floatchat[dev,server]",
]

[project.scripts]
floatchat-api = "agentic_workflow.api.app:run"

[tool.setuptools.packages.find]
include = ["agentic_workflow*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "ANN"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

